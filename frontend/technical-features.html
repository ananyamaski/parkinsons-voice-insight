<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Technical Features | Parkinson's Voice Insight
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body class="dashboard-page technical-features-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="dashboard-header">

    <div class="dashboard-logo">

        <div class="logo-icon">
            〽
        </div>

        <div class="logo-text">
            <strong>Parkinson's</strong>
            <span>Voice Insight</span>
        </div>

    </div>


    <nav class="dashboard-nav">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="analysis.html">
            Analyze Voice
        </a>

        <a href="history.html">
            History
        </a>

    </nav>


    <div class="dashboard-user">

        <div class="notification-icon">
            ♧
        </div>

        <div class="user-profile">

            <div class="user-avatar">
                👤
            </div>

            <span id="welcomeUser"></span>

        </div>

    </div>

</header>

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="technical-page-container">


        <!-- =================================================
             INTRO
        ================================================== -->

        <section class="technical-page-header">

            <div class="technical-intro-text">

                <p class="eyebrow">
                    VOICE ANALYSIS DETAILS
                </p>


                <h1>
                    Technical
                    <span class="highlight-text">
                        Features
                    </span>
                </h1>

                <p>
                    Detailed voice characteristics extracted
                    from your submitted voice sample.
                </p>

            </div>


        </section>


        <!-- =================================================
             FEATURE CARD
        ================================================== -->

        <section class="technical-main-card">

            <div class="technical-card-header">

                <div>

                    <h2>
                        Technical Voice Features
                    </h2>

                    <p>
                        Detailed measurements extracted from
                        your voice sample.
                    </p>

                </div>

                <div class="feature-count">

                    <span id="featureCount">
                        0
                    </span>

                    Features

                </div>

            </div>


            <!-- =================================================
                 26 FEATURES
            ================================================== -->

            <div
                id="technicalFeaturesGrid"
                class="reference-technical-grid"
            >

            </div>



        <!-- =================================================
             FOOTER ACTIONS
        ================================================== -->

        <div class="technical-reference-actions">

            <button
                id="backToParametersBtnBottom"
                class="details-button secondary-details-button"
                type="button"
            >
                Back to Voice Parameters
            </button>


        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="./js/technical-features.js"></script>


</body>

</html>
